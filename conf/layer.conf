# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}:${LAYERDIR}/lib"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-rdk-vcc"
BBFILE_PATTERN_meta-rdk-vcc = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-rdk-vcc = "6"

LAYERDEPENDS_meta-rdk-vcc = "core"
LAYERSERIES_COMPAT_meta-rdk-vcc = "dunfell kirkstone"

#Enable VCC class
USER_CLASSES_append = " vcc "
#Yaml config store, needed by the VCC class 
YAML_CONFIG = ""
UPDATED_RECIPES = ""
BB_BASEHASH_IGNORE_VARS_append = " YAML_CONFIG "

#Need to add this command to host tools for ipk extraction
HOSTTOOLS += " xz"

# In layered builds some .bb files may not be provided which we are providing a .bbappend file to support VCC package mode. 
# The following tells Yocto to produce a warning instead of an error.
BB_DANGLINGAPPENDS_WARNONLY = "1"
